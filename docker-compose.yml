services:
  db:
    image: postgres:16-alpine
    container_name: microfinance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: microfinance_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: microfinance-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend/rails-api
      dockerfile: Dockerfile
    container_name: microfinance-rails-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      DB_ADAPTER: postgresql
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: microfinance_development
      DB_USER: postgres
      DB_PASSWORD: password
      REDIS_URL: redis://redis:6379/1
    ports:
      - "3000:3000"
    volumes:
      - ./backend/rails-api:/rails
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails db:prepare && bundle exec rails s -b 0.0.0.0 -p 3000"

volumes:
  postgres_data:
  redis_data:
